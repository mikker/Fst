name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: Scripts/test.sh
      - run: Scripts/agent-build.sh build -project Fst.xcodeproj -scheme Fst -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
